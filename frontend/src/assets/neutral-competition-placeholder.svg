<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="placeholderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="50%" stop-color="#161619" />
      <stop offset="100%" stop-color="#101012" />
    </linearGradient>

    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#placeholderBg)" />

  <!-- Subtle Inner Border -->
  <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="url(#subtleBorder)" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Center Image Placeholder Icon -->
  <g transform="translate(400, 440)">
    <!-- Rounded icon frame -->
    <rect x="-70" y="-70" width="140" height="140" rx="28" fill="#222226" stroke="#2E2E34" stroke-width="2" />

    <!-- Image / Mountain / Sun icon -->
    <g stroke="#71717A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Image frame -->
      <rect x="-36" y="-36" width="72" height="72" rx="8" />
      <!-- Sun circle -->
      <circle cx="-16" cy="-16" r="6" fill="#71717A" />
      <!-- Mountain peak -->
      <path d="M 36 24 L 8 -4 L -16 20" />
      <path d="M -8 24 L -20 12 L -36 28" />
    </g>
  </g>

  <!-- Placeholder Text -->
  <text x="400" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#A1A1AA">
    NO POSTER AVAILABLE
  </text>

  <text x="400" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" letter-spacing="2" fill="#52525B">
    OFFICIAL COMPETITION ENTRY
  </text>
</svg>